<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ying's Journal</title>
<style>
:root{
  --bg:#f7f3ec;--card:#fffdf9;--text:#2f3a32;--muted:#7b827a;
  --accent:#6f866f;--accent-dark:#546b57;--accent-soft:#dfe8df;
  --line:#e8e1d7;--danger:#a45f5f;--shadow:0 10px 28px rgba(70,70,60,.06)
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}
a{color:inherit;text-decoration:none}
button,input,textarea{font:inherit}
.wrap{max-width:980px;margin:0 auto;padding:28px 20px 70px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:38px}
.brand{font-weight:700;letter-spacing:.18em}
.nav{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.nav a:hover{color:var(--accent)}
.hero{display:grid;grid-template-columns:1.35fr .65fr;gap:24px;align-items:end;margin-bottom:28px}
.eyebrow{color:var(--accent);font-size:13px;letter-spacing:.12em;text-transform:uppercase}
h1,h2{font-family:Georgia,"Times New Roman",serif}
h1{font-size:58px;line-height:1;margin:10px 0 14px}
.intro{font-size:17px;line-height:1.8;color:var(--muted);max-width:620px}
.note{background:var(--accent-soft);padding:18px;border-radius:18px;font-family:Georgia,"Times New Roman",serif;font-style:italic;line-height:1.7}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0 28px}
.btn{border:none;border-radius:999px;padding:11px 18px;cursor:pointer;transition:.18s ease;background:white;border:1px solid var(--line);color:var(--text)}
.btn:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.btn.primary{background:var(--accent);color:white;border-color:var(--accent)}
.btn.primary:hover{background:var(--accent-dark)}
.btn.small{padding:7px 12px;font-size:12px}
.btn.danger{color:var(--danger)}
.composer{display:none;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px;margin-bottom:30px;box-shadow:var(--shadow)}
.composer.open{display:block}
.composer h2{font-size:30px;margin:0 0 18px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{display:flex;flex-direction:column;gap:7px}
.field.full{grid-column:1/-1}
label{font-size:13px;color:var(--muted)}
input,textarea{width:100%;border:1px solid var(--line);border-radius:13px;background:#fff;padding:12px 13px;color:var(--text);outline:none}
input:focus,textarea:focus{border-color:#a8b6a8;box-shadow:0 0 0 3px rgba(111,134,111,.10)}
textarea{min-height:170px;resize:vertical;line-height:1.8}
.help{font-size:12px;color:var(--muted);line-height:1.6}
.preview{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.preview img{width:110px;height:82px;object-fit:cover;border-radius:12px;border:1px solid var(--line)}
.composer-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.year-title{display:flex;align-items:center;gap:12px;margin:36px 0 18px;color:var(--accent)}
.year-title:after{content:"";height:1px;background:var(--line);flex:1}
.entry{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:26px;margin-bottom:22px;box-shadow:var(--shadow)}
.entry-head{display:flex;justify-content:space-between;gap:18px;align-items:flex-start}
.date{font-size:13px;color:var(--accent);letter-spacing:.05em;text-transform:uppercase}
.entry h2{font-size:30px;margin:6px 0 10px}
.tags{display:flex;gap:8px;flex-wrap:wrap}
.tag{background:#eef2ec;border-radius:999px;padding:5px 10px;font-size:12px;color:var(--accent)}
.entry p{line-height:1.95;margin:16px 0;color:#4d554e;white-space:pre-wrap}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
.photo{aspect-ratio:4/3;border-radius:16px;background:#ece7de;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.entry-tools{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.empty{padding:40px 20px;text-align:center;color:var(--muted);border:1px dashed #d8d1c6;border-radius:20px;background:rgba(255,255,255,.35)}
.footer{margin-top:44px;color:var(--muted);font-size:13px;text-align:center}
.toast{position:fixed;right:20px;bottom:20px;background:#2f3a32;color:white;padding:11px 15px;border-radius:12px;opacity:0;transform:translateY(12px);pointer-events:none;transition:.2s;z-index:20}
.toast.show{opacity:1;transform:translateY(0)}
.hidden{display:none}
@media(max-width:760px){
  .hero{grid-template-columns:1fr} h1{font-size:44px}.entry-head{display:block}.tags{margin-top:10px}
  .photos{grid-template-columns:1fr 1fr}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand">YING</div>
    <div class="nav">
      <a href="index.html">Home</a><a href="index.html#academic">Academic</a><a href="index.html#life">Life</a>
      <a href="journal.html">Journal</a><a href="calendar.html">Calendar</a>
    </div>
  </div>

  <section class="hero">
    <div>
      <div class="eyebrow">Daily journal</div>
      <h1>Little moments,<br>slowly collected.</h1>
      <div class="intro">记录日常、咖啡、旅行、实验室里的小事，还有那些不想忘记的普通一天。</div>
    </div>
    <div class="note">“A quiet place for ordinary days.”</div>
  </section>

  <div class="actions">
    <button class="btn primary" id="newBtn">＋ 写日记</button>
    <button class="btn" id="exportBtn">备份日记</button>
    <button class="btn" id="importBtn">恢复备份</button>
    <input id="importFile" class="hidden" type="file" accept="application/json">
  </div>

  <section class="composer" id="composer">
    <h2 id="composerTitle">写一篇新日记</h2>
    <div class="form-grid">
      <div class="field"><label>日期</label><input id="dateInput" type="date"></div>
      <div class="field"><label>地点（可选）</label><input id="locationInput" placeholder="Tokyo"></div>
      <div class="field full"><label>标题</label><input id="titleInput" placeholder="今天发生了什么？"></div>
      <div class="field full"><label>标签（用逗号分开）</label><input id="tagsInput" placeholder="Daily, Coffee, Travel"></div>
      <div class="field full"><label>正文</label><textarea id="bodyInput" placeholder="写下今天想记住的事情……"></textarea></div>
      <div class="field full">
        <label>照片（最多 3 张）</label>
        <input id="photosInput" type="file" accept="image/*" multiple>
        <div class="help">照片会压缩后保存在当前浏览器中。为避免空间不足，建议每篇最多 3 张。</div>
        <div class="preview" id="preview"></div>
      </div>
    </div>
    <div class="composer-actions">
      <button class="btn" id="cancelBtn">取消</button>
      <button class="btn primary" id="saveBtn">保存日记</button>
    </div>
  </section>

  <main id="entries"></main>
  <div class="footer">Ying's Journal · made with small memories</div>
</div>
<div class="toast" id="toast"></div>

<script>
const KEY='ying_journal_entries_v2';
let entries=[]; let editingId=null; let photoData=[];
const $=id=>document.getElementById(id);

function today(){return new Date().toISOString().slice(0,10)}
function load(){try{entries=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){entries=[]} render()}
function persist(){localStorage.setItem(KEY,JSON.stringify(entries))}
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
function esc(s=''){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function formatDate(s){if(!s)return'';const d=new Date(s+'T00:00:00');return d.toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'})}

function openComposer(item=null){
  editingId=item?.id||null; photoData=item?.photos?[...item.photos]:[];
  $('composerTitle').textContent=editingId?'编辑日记':'写一篇新日记';
  $('dateInput').value=item?.date||today(); $('locationInput').value=item?.location||'';
  $('titleInput').value=item?.title||''; $('tagsInput').value=(item?.tags||[]).join(', '); $('bodyInput').value=item?.body||'';
  $('photosInput').value=''; renderPreview(); $('composer').classList.add('open');
  $('composer').scrollIntoView({behavior:'smooth',block:'start'});
}
function closeComposer(){editingId=null;photoData=[];$('composer').classList.remove('open')}
function renderPreview(){
  $('preview').innerHTML=photoData.map((src,i)=>`<div><img src="${src}" alt="photo ${i+1}"><br><button class="btn small danger" onclick="removePhoto(${i})">删除</button></div>`).join('')
}
window.removePhoto=i=>{photoData.splice(i,1);renderPreview()}

function compressImage(file){return new Promise((resolve,reject)=>{
  const reader=new FileReader(); reader.onload=e=>{const img=new Image();img.onload=()=>{
    const max=1200;let w=img.width,h=img.height;if(Math.max(w,h)>max){const r=max/Math.max(w,h);w=Math.round(w*r);h=Math.round(h*r)}
    const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);resolve(c.toDataURL('image/jpeg',.72))
  };img.onerror=reject;img.src=e.target.result};reader.onerror=reject;reader.readAsDataURL(file)
})}

$('photosInput').addEventListener('change',async e=>{
  const files=[...e.target.files].slice(0,Math.max(0,3-photoData.length));
  for(const f of files){try{photoData.push(await compressImage(f))}catch(err){toast('有一张照片无法读取')}} renderPreview();
})

function saveEntry(){
  const date=$('dateInput').value,title=$('titleInput').value.trim(),body=$('bodyInput').value.trim();
  if(!date){toast('请选择日期');return} if(!title){toast('请写一个标题');return}
  const item={id:editingId||('j_'+Date.now()),date,location:$('locationInput').value.trim(),title,
    tags:$('tagsInput').value.split(',').map(x=>x.trim()).filter(Boolean),body,photos:[...photoData],updatedAt:Date.now()};
  if(editingId){entries=entries.map(x=>x.id===editingId?item:x)}else entries.push(item);
  try{persist()}catch(e){toast('保存空间不足，请减少照片');return}
  closeComposer();render();toast(editingId?'已更新':'已保存');
}
function editEntry(id){const item=entries.find(x=>x.id===id);if(item)openComposer(item)}
function deleteEntry(id){if(!confirm('确定删除这篇日记吗？'))return;entries=entries.filter(x=>x.id!==id);persist();render();toast('已删除')}
window.editEntry=editEntry;window.deleteEntry=deleteEntry;

function render(){
  const root=$('entries'); if(!entries.length){root.innerHTML='<div class="empty">还没有日记。点击上面的「＋ 写日记」开始第一篇 🌿</div>';return}
  const sorted=[...entries].sort((a,b)=>b.date.localeCompare(a.date)||b.updatedAt-a.updatedAt);let html='',lastYear='';
  for(const e of sorted){const year=e.date.slice(0,4);if(year!==lastYear){html+=`<div class="year-title"><strong>${year}</strong></div>`;lastYear=year}
    const tags=(e.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('');
    const photos=(e.photos||[]).length?`<div class="photos">${e.photos.map((p,i)=>`<div class="photo"><img src="${p}" alt="journal photo ${i+1}"></div>`).join('')}</div>`:'';
    html+=`<article class="entry"><div class="entry-head"><div><div class="date">${esc(formatDate(e.date))}${e.location?' · '+esc(e.location):''}</div><h2>${esc(e.title)}</h2></div><div class="tags">${tags}</div></div><p>${esc(e.body)}</p>${photos}<div class="entry-tools"><button class="btn small" onclick="editEntry('${e.id}')">编辑</button><button class="btn small danger" onclick="deleteEntry('${e.id}')">删除</button></div></article>`
  }
  root.innerHTML=html;
}

$('newBtn').onclick=()=>openComposer(); $('cancelBtn').onclick=closeComposer; $('saveBtn').onclick=saveEntry;
$('exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify(entries,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ying-journal-backup.json';a.click();URL.revokeObjectURL(a.href);toast('备份已下载')};
$('importBtn').onclick=()=>$('importFile').click();
$('importFile').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const data=JSON.parse(r.result);if(!Array.isArray(data))throw 0;if(!confirm('恢复备份会替换当前日记，继续吗？'))return;entries=data;persist();render();toast('备份已恢复')}catch(err){toast('备份文件格式不正确')}};r.readAsText(f)});
load();
</script>
</body>
</html>
