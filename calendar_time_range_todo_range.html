<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Ying's Calendar</title>
<style>
:root{--bg:#f7f5f2;--panel:#fff;--text:#242424;--muted:#77736d;--line:#dedad5;--accent:#5c6f68;--soft:#e8eeeb;--life:#b68564;--important:#b75c5c}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text)}
a{color:inherit}.app{width:min(1220px,94%);margin:auto;padding:22px 0 50px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:18px}
.top-left{display:flex;align-items:flex-start;gap:18px}.back{margin-top:9px;text-decoration:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:.55rem .85rem;color:var(--muted)}
h1{margin:0;font-size:clamp(2rem,4vw,3.4rem)}.sub{color:var(--muted);margin:.3rem 0 0}.today{border:1px solid var(--line);background:#fff;border-radius:999px;padding:.7rem 1rem;cursor:pointer}
.layout{display:grid;grid-template-columns:1.5fr .85fr;gap:18px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px}
.calhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.calhead button{border:0;background:var(--soft);color:var(--accent);width:38px;height:38px;border-radius:50%;cursor:pointer}
.month{font-weight:700;font-size:1.2rem}.week,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.week div{text-align:center;color:var(--muted);font-size:.85rem;padding:.4rem 0}
.day{min-height:92px;border:1px solid var(--line);border-radius:12px;padding:8px;cursor:pointer}.day.other{opacity:.35}.day.now{outline:2px solid var(--accent)}.day.sel{background:var(--soft)}
.num{font-weight:600}.dots{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}.dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}.dot.life{background:var(--life)}.dot.important{background:var(--important)}
.tabs{display:flex;gap:8px;margin-bottom:14px}.tab{border:1px solid var(--line);background:#fff;padding:.55rem .9rem;border-radius:999px;cursor:pointer;color:var(--muted)}.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.tabpage{display:none}.tabpage.active{display:block}h2{margin:.2rem 0}.date{color:var(--muted);margin-bottom:14px}.form{display:grid;gap:10px;margin-bottom:18px}
.time-row{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}.time-label{font-size:.82rem;color:var(--muted);margin-bottom:-4px}
input,select,textarea{width:100%;padding:.75rem .85rem;border:1px solid var(--line);border-radius:10px;font:inherit}textarea{min-height:68px;resize:vertical}
.add{border:0;background:var(--accent);color:#fff;padding:.8rem 1rem;border-radius:10px;cursor:pointer;font-weight:600}.tasks,.todos{display:grid;gap:10px}
.task,.todo{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start}.task.done .title,.todo.done .title{text-decoration:line-through;opacity:.5}
.meta{font-size:.85rem;color:var(--muted);margin-top:4px}.tag{display:inline-block;padding:.15rem .45rem;border-radius:999px;background:var(--soft);color:var(--accent);margin-right:6px}.tag.life{background:#f0e2d7;color:#9a6747}.tag.important{background:#f4dddd;color:#a74a4a}
.del{border:0;background:transparent;color:var(--important);cursor:pointer;font-size:1.1rem}.empty{color:var(--muted);text-align:center;padding:22px;border:1px dashed var(--line);border-radius:12px}
.todo-form{display:grid;grid-template-columns:1fr auto;gap:8px;margin-bottom:12px}.todo-form button{border:0;background:var(--accent);color:#fff;border-radius:10px;padding:0 1rem;cursor:pointer}
.todo-tools{display:flex;justify-content:space-between;align-items:center;margin:10px 0 14px;color:var(--muted);font-size:.9rem}.small-btn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:.4rem .7rem;cursor:pointer;color:var(--muted)}
@media(max-width:820px){.layout{grid-template-columns:1fr}.day{min-height:70px}.top{align-items:flex-start}.top-left{gap:10px}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="top-left">
      <a class="back" href="index.html">← Home</a>
      <div><h1>My Calendar</h1><p class="sub">日程 + 待办，都放在这里。</p></div>
    </div>
    <button class="today" id="todayBtn">今天</button>
  </div>

  <div class="layout">
    <section class="panel">
      <div class="calhead"><button id="prev">←</button><div class="month" id="month"></div><button id="next">→</button></div>
      <div class="week"><div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div></div>
      <div class="days" id="days"></div>
    </section>

    <aside class="panel">
      <div class="tabs"><button class="tab active" data-tab="schedule">日程</button><button class="tab" data-tab="todo">待办</button></div>

      <div id="schedule" class="tabpage active">
        <h2>日程</h2><div class="date" id="date"></div>
        <div class="form">
          <input id="title" placeholder="例如：实验、会议、吃饭、旅行">
          <div class="time-label">开始时间 → 结束时间</div>
          <div class="time-row">
            <input id="startTime" type="time" aria-label="开始时间">
            <span style="color:var(--muted)">→</span>
            <input id="endTime" type="time" aria-label="结束时间">
          </div>
          <select id="cat"><option value="academic">学术</option><option value="life">生活</option><option value="important">重要</option></select>
          <textarea id="note" placeholder="备注（可选）"></textarea>
          <button class="add" id="add">添加日程</button>
        </div>
        <div class="tasks" id="tasks"></div>
      </div>

      <div id="todo" class="tabpage">
        <h2>待办清单</h2>
        <div class="todo-form" style="grid-template-columns:1fr;gap:8px">
          <input id="todoTitle" placeholder="例如：整理数据、买咖啡豆、预约...">
          <div class="time-label">开始时间 → 结束时间</div>
          <div class="time-row">
            <input id="todoStartTime" type="time" aria-label="待办开始时间">
            <span style="color:var(--muted)">→</span>
            <input id="todoEndTime" type="time" aria-label="待办结束时间">
          </div>
          <button id="addTodo" style="min-height:42px">添加</button>
        </div>
        <div class="todo-tools"><span id="todoCount">0 项未完成</span><button class="small-btn" id="clearDone">清除已完成</button></div>
        <div class="todos" id="todos"></div>
      </div>
    </aside>
  </div>
</div>

<script>
const K="ying_calendar_v2";
let store=JSON.parse(localStorage.getItem(K)||'{"events":{},"todos":[]}');
if(!store.events) store.events={}; if(!store.todos) store.todos=[];
const now=new Date(); let view=new Date(now.getFullYear(),now.getMonth(),1); let sel=new Date(now.getFullYear(),now.getMonth(),now.getDate()); const $=id=>document.getElementById(id);

function dateKey(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function same(a,b){return a.getFullYear()==b.getFullYear()&&a.getMonth()==b.getMonth()&&a.getDate()==b.getDate()}
function save(){localStorage.setItem(K,JSON.stringify(store))}
function catLabel(c){return c==="life"?"生活":c==="important"?"重要":"学术"}

function renderCal(){
  $("days").innerHTML=""; const y=view.getFullYear(),m=view.getMonth(); $("month").textContent=`${y}年 ${m+1}月`; const first=new Date(y,m,1), start=new Date(y,m,1-first.getDay());
  for(let i=0;i<42;i++){
    let d=new Date(start); d.setDate(start.getDate()+i); let e=document.createElement("div");
    e.className="day"+(d.getMonth()!=m?" other":"")+(same(d,now)?" now":"")+(same(d,sel)?" sel":""); e.innerHTML=`<div class="num">${d.getDate()}</div>`;
    let arr=store.events[dateKey(d)]||[]; if(arr.length){let dots=document.createElement("div"); dots.className="dots"; arr.slice(0,6).forEach(t=>{let s=document.createElement("span"); s.className="dot "+t.cat; dots.appendChild(s)}); e.appendChild(dots)}
    e.onclick=()=>{sel=new Date(d.getFullYear(),d.getMonth(),d.getDate()); if(d.getMonth()!=m) view=new Date(d.getFullYear(),d.getMonth(),1); renderAll()}; $("days").appendChild(e)
  }
}

function renderTasks(){
  const k=dateKey(sel), arr=store.events[k]||[]; $("date").textContent=`${sel.getFullYear()}年${sel.getMonth()+1}月${sel.getDate()}日`; $("tasks").innerHTML="";
  if(!arr.length){$("tasks").innerHTML='<div class="empty">这一天还没有安排。</div>'; return}
  arr.sort((a,b)=>(a.startTime||a.time||"99:99").localeCompare(b.startTime||b.time||"99:99")).forEach((t,i)=>{
    const s=t.startTime||t.time||"", en=t.endTime||"", timeText=s&&en?`${s}–${en}`:s;
    let e=document.createElement("div"); e.className="task"+(t.done?" done":"");
    e.innerHTML=`<input type="checkbox" ${t.done?"checked":""}><div><div class="title">${t.title}</div><div class="meta"><span class="tag ${t.cat}">${catLabel(t.cat)}</span>${timeText}${t.note?" · "+t.note:""}</div></div><button class="del">×</button>`;
    e.querySelector("input").onchange=x=>{t.done=x.target.checked;save();renderTasks()}; e.querySelector(".del").onclick=()=>{arr.splice(i,1); if(!arr.length) delete store.events[k]; save(); renderAll()}; $("tasks").appendChild(e)
  })
}

function renderTodos(){
  $("todos").innerHTML=""; const left=store.todos.filter(t=>!t.done).length; $("todoCount").textContent=`${left} 项未完成`;
  if(!store.todos.length){$("todos").innerHTML='<div class="empty">目前没有待办。</div>'; return}
  store.todos.forEach((t,i)=>{
    const s=t.startTime||"", en=t.endTime||"";
    const timeText=s&&en?`${s}–${en}`:s;
    let e=document.createElement("div");
    e.className="todo"+(t.done?" done":"");
    e.innerHTML=`<input type="checkbox" ${t.done?"checked":""}>
      <div>
        <div class="title">${t.title}</div>
        ${timeText?`<div class="meta">${timeText}</div>`:""}
      </div>
      <button class="del">×</button>`;
    e.querySelector("input").onchange=x=>{t.done=x.target.checked;save();renderTodos()};
    e.querySelector(".del").onclick=()=>{store.todos.splice(i,1);save();renderTodos()};
    $("todos").appendChild(e)
  })
}

function renderAll(){renderCal();renderTasks();renderTodos()}
$("prev").onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()-1,1);renderCal()}; $("next").onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()+1,1);renderCal()};
$("todayBtn").onclick=()=>{sel=new Date(now.getFullYear(),now.getMonth(),now.getDate()); view=new Date(now.getFullYear(),now.getMonth(),1); renderAll()};

$("add").onclick=()=>{
  let t=$("title").value.trim(); if(!t) return alert("先写一个日程名称。");
  const s=$("startTime").value, e=$("endTime").value; if(s&&e&&e<s) return alert("结束时间不能早于开始时间。");
  let k=dateKey(sel); store.events[k]=store.events[k]||[]; store.events[k].push({title:t,startTime:s,endTime:e,cat:$("cat").value,note:$("note").value.trim(),done:false});
  $("title").value=""; $("startTime").value=""; $("endTime").value=""; $("note").value=""; save(); renderAll()
};

$("addTodo").onclick=()=>{
  let t=$("todoTitle").value.trim();
  if(!t) return;
  const s=$("todoStartTime").value, e=$("todoEndTime").value;
  if(s&&e&&e<s) return alert("结束时间不能早于开始时间。");
  store.todos.push({title:t,startTime:s,endTime:e,done:false});
  $("todoTitle").value="";
  $("todoStartTime").value="";
  $("todoEndTime").value="";
  save();
  renderTodos()
};
$("todoTitle").addEventListener("keydown",e=>{if(e.key==="Enter") $("addTodo").click()}); $("clearDone").onclick=()=>{store.todos=store.todos.filter(t=>!t.done); save(); renderTodos()};

document.querySelectorAll(".tab").forEach(btn=>{btn.onclick=()=>{document.querySelectorAll(".tab").forEach(b=>b.classList.remove("active")); document.querySelectorAll(".tabpage").forEach(p=>p.classList.remove("active")); btn.classList.add("active"); $(btn.dataset.tab).classList.add("active")}});
renderAll();
</script>
</body>
</html>
