<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>My Calendar</title>
<style>
:root{--bg:#f7f5f2;--panel:#fff;--text:#242424;--muted:#77736d;--line:#dedad5;--accent:#5c6f68;--soft:#e8eeeb;--life:#b68564;--important:#b75c5c}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text)}
.app{width:min(1180px,94%);margin:auto;padding:28px 0 50px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:18px}
h1{margin:0;font-size:clamp(2rem,4vw,3.4rem)}.sub{color:var(--muted);margin:.3rem 0 0}.today{border:1px solid var(--line);background:#fff;border-radius:999px;padding:.7rem 1rem;cursor:pointer}
.layout{display:grid;grid-template-columns:1.5fr .8fr;gap:18px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px}
.calhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.calhead button{border:0;background:var(--soft);color:var(--accent);width:38px;height:38px;border-radius:50%;cursor:pointer}
.month{font-weight:700;font-size:1.2rem}.week,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.week div{text-align:center;color:var(--muted);font-size:.85rem;padding:.4rem 0}
.day{min-height:92px;border:1px solid var(--line);border-radius:12px;padding:8px;cursor:pointer}.day.other{opacity:.35}.day.now{outline:2px solid var(--accent)}.day.sel{background:var(--soft)}
.num{font-weight:600}.dots{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}.dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}.dot.life{background:var(--life)}.dot.important{background:var(--important)}
h2{margin:.2rem 0}.date{color:var(--muted);margin-bottom:14px}.form{display:grid;gap:10px;margin-bottom:18px}
input,select,textarea{width:100%;padding:.75rem .85rem;border:1px solid var(--line);border-radius:10px;font:inherit}.add{border:0;background:var(--accent);color:#fff;padding:.8rem 1rem;border-radius:10px;cursor:pointer;font-weight:600}
.tasks{display:grid;gap:10px}.task{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;grid-template-columns:auto 1fr auto;gap:10px}.task.done .title{text-decoration:line-through;opacity:.5}
.meta{font-size:.85rem;color:var(--muted);margin-top:4px}.tag{display:inline-block;padding:.15rem .45rem;border-radius:999px;background:var(--soft);color:var(--accent);margin-right:6px}.tag.life{background:#f0e2d7;color:#9a6747}.tag.important{background:#f4dddd;color:#a74a4a}
.del{border:0;background:transparent;color:var(--important);cursor:pointer;font-size:1.1rem}.empty{color:var(--muted);text-align:center;padding:22px;border:1px dashed var(--line);border-radius:12px}
@media(max-width:820px){.layout{grid-template-columns:1fr}.day{min-height:70px}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div><h1>My Calendar</h1><p class="sub">学术、生活和重要事项都放在这里。</p></div>
    <button class="today" id="todayBtn">今天</button>
  </div>
  <div class="layout">
    <section class="panel">
      <div class="calhead"><button id="prev">←</button><div class="month" id="month"></div><button id="next">→</button></div>
      <div class="week"><div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div></div>
      <div class="days" id="days"></div>
    </section>
    <aside class="panel">
      <h2>日程</h2><div class="date" id="date"></div>
      <div class="form">
        <input id="title" placeholder="例如：实验、会议、吃饭、旅行">
        <input id="time" type="time">
        <select id="cat"><option value="academic">学术</option><option value="life">生活</option><option value="important">重要</option></select>
        <textarea id="note" placeholder="备注（可选）"></textarea>
        <button class="add" id="add">添加日程</button>
      </div>
      <div class="tasks" id="tasks"></div>
    </aside>
  </div>
</div>
<script>
const K="ying_calendar_v1";let data=JSON.parse(localStorage.getItem(K)||"{}");
const now=new Date();let view=new Date(now.getFullYear(),now.getMonth(),1);let sel=new Date(now.getFullYear(),now.getMonth(),now.getDate());
const $=id=>document.getElementById(id);
function key(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function same(a,b){return a.getFullYear()==b.getFullYear()&&a.getMonth()==b.getMonth()&&a.getDate()==b.getDate()}
function save(){localStorage.setItem(K,JSON.stringify(data))}
function renderCal(){
 $("days").innerHTML=""; const y=view.getFullYear(),m=view.getMonth(); $("month").textContent=`${y}年 ${m+1}月`;
 const first=new Date(y,m,1),start=new Date(y,m,1-first.getDay());
 for(let i=0;i<42;i++){let d=new Date(start);d.setDate(start.getDate()+i);let e=document.createElement("div");e.className="day"+(d.getMonth()!=m?" other":"")+(same(d,now)?" now":"")+(same(d,sel)?" sel":"");
 e.innerHTML=`<div class="num">${d.getDate()}</div>`; let arr=data[key(d)]||[]; if(arr.length){let dots=document.createElement("div");dots.className="dots";arr.slice(0,6).forEach(t=>{let s=document.createElement("span");s.className="dot "+t.cat;dots.appendChild(s)});e.appendChild(dots)}
 e.onclick=()=>{sel=new Date(d.getFullYear(),d.getMonth(),d.getDate());if(d.getMonth()!=m)view=new Date(d.getFullYear(),d.getMonth(),1);render()};$("days").appendChild(e)}
}
function label(c){return c==="life"?"生活":c==="important"?"重要":"学术"}
function renderTasks(){
 const k=key(sel),arr=data[k]||[];$("date").textContent=`${sel.getFullYear()}年${sel.getMonth()+1}月${sel.getDate()}日`;$("tasks").innerHTML="";
 if(!arr.length){$("tasks").innerHTML='<div class="empty">这一天还没有安排。</div>';return}
 arr.sort((a,b)=>(a.time||"99:99").localeCompare(b.time||"99:99")).forEach((t,i)=>{let e=document.createElement("div");e.className="task"+(t.done?" done":"");
 e.innerHTML=`<input type="checkbox" ${t.done?"checked":""}><div><div class="title">${t.title}</div><div class="meta"><span class="tag ${t.cat}">${label(t.cat)}</span>${t.time||""}${t.note?" · "+t.note:""}</div></div><button class="del">×</button>`;
 e.querySelector("input").onchange=x=>{t.done=x.target.checked;save();renderTasks()};e.querySelector(".del").onclick=()=>{arr.splice(i,1);if(!arr.length)delete data[k];save();render()};$("tasks").appendChild(e)})
}
function render(){renderCal();renderTasks()}
$("prev").onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()-1,1);renderCal()};$("next").onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()+1,1);renderCal()};
$("todayBtn").onclick=()=>{sel=new Date(now.getFullYear(),now.getMonth(),now.getDate());view=new Date(now.getFullYear(),now.getMonth(),1);render()};
$("add").onclick=()=>{let t=$("title").value.trim();if(!t)return alert("先写一个日程名称。");let k=key(sel);data[k]=data[k]||[];data[k].push({title:t,time:$("time").value,cat:$("cat").value,note:$("note").value.trim(),done:false});$("title").value="";$("time").value="";$("note").value="";save();render()};
render();
</script>
</body>
</html>
